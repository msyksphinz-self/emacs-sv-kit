name: check

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    # A snapshot build breaking is news about Emacs, not about this package.
    continue-on-error: ${{ matrix.emacs == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs:
          - '27.2'
          - '28.2'
          - '29.4'
          - '30.1'
          - snapshot

    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - name: Report the version under test
        run: emacs --version

      # `make check' byte-compiles with warnings treated as errors and then
      # runs the ERT suite.
      - name: Byte-compile and test
        run: make check
